[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deckgl-marimo"
version = "0.6.1"
description = "deck.gl visualization library for marimo notebooks — interactive maps with 33 layer types"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Scott Lemke", email = "scott.r.lemke@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
keywords = ["deck.gl", "maplibre", "marimo", "anywidget", "geospatial", "visualization", "maps"]
dependencies = [
    "anywidget>=0.9.0",
    "traitlets>=5.0.0",
    "narwhals>=1.0.0",
    "marimo>=0.22",
    "pandas>=2.3.3",
]

[project.urls]
Homepage = "https://github.com/kihaji/deckgl-marimo"
Documentation = "https://kihaji.github.io/deckgl-marimo"
Repository = "https://github.com/kihaji/deckgl-marimo"
Issues = "https://github.com/kihaji/deckgl-marimo/issues"

[project.optional-dependencies]
binary = ["numpy"]
dev = [
    "marimo",
    "pandas",
    "polars",
    "pytest",
    "geopandas",
    "duckdb",
    "httptools>=0.7.1",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
]
